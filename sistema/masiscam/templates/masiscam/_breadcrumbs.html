{% load masiscam_navigation %}
{% breadcrumbs as items %}
<nav class="masiscam-breadcrumbs no-print" aria-label="Migas de pan">
  <ol class="breadcrumb mb-0 small">
    {% for item in items %}<li class="breadcrumb-item{% if forloop.last %} active{% endif %}"{% if forloop.last %} aria-current="page"{% endif %}>{% if item.url %}<a href="{{ item.url }}">{{ item.label }}</a>{% else %}{{ item.label }}{% endif %}</li>{% endfor %}
  </ol>
</nav>
