<ol class="mf-steps" aria-label="Proceso de mantenimiento">{% for p in pasos %}<li class="mf-step is-{{ p.clase|default:'pendiente' }}" data-estado="{{ p.estado }}"{% if forloop.counter == paso %} aria-current="step"{% endif %}><span class="mf-number" aria-hidden="true">{% if p.clase == 'ok' %}✓{% else %}{{ forloop.counter }}{% endif %}</span><div><strong>{{ p.nombre }}</strong><small class="mf-chip">{{ p.estado }}</small></div></li>{% endfor %}</ol>
