{% extends "masiscam/base.html" %}
{% block content %}<div class="container py-4"><div class="card masiscam-card"><div class="card-body p-3 p-lg-4"><h1 class="h3 mb-4">{{ titulo }}</h1><form method="post" enctype="multipart/form-data" novalidate>{% csrf_token %}{% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}<div class="row g-3">{% for field in form %}<div class="{% if field.name == 'descripcion' or field.name == 'observaciones' %}col-12{% else %}col-md-6{% endif %}"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} *{% endif %}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}</div><div class="d-flex gap-2 mt-4"><button class="btn btn-primary">Guardar</button><a class="btn btn-outline-secondary" href="{% if proyecto %}{% url 'masiscam:proyecto_detalle' proyecto.pk %}{% else %}{% url 'masiscam:dashboard' %}{% endif %}">Cancelar</a></div></form></div></div></div>{% endblock %}
