{% if error_documentos %}<span class="text-muted" role="status">Los documentos no están disponibles temporalmente. Intente más tarde.</span>
{% elif documentos_drive %}<ul class="registro-documentos">
{% for documento in documentos_drive %}<li><a class="text-break" href="{% url 'masiscam:equipo_documento_privado' equipo.pk documento.id %}" download>{{ documento.name }}</a></li>{% endfor %}
</ul>{% else %}<span class="text-muted">Sin documentos</span>{% endif %}
