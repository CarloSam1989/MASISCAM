{% load static masiscam_navigation %}{% menu_compartido as menu %}
<header class="app-header mc-header"><div class="container mc-topbar"><a class="app-brand" href="{{ menu.inicio }}" aria-label="MASISCAM · Inicio"><img src="{% static 'masiscam/img/logo_transparente.png' %}" alt="MASISCAM" width="112" height="42"></a><nav id="appMenu" class="collapse app-menu" aria-label="Sistema MASISCAM">{% for item in menu.items %}<a href="{{ item.url }}"{% if item.activo %} aria-current="page"{% endif %}>{{ item.label }}</a>{% endfor %}</nav><div class="mc-session"><strong>{{ menu.rol }}</strong><span title="{{ request.empresa_activa.nombre }} · {{ user.get_full_name|default:user.username }}">{{ user.get_full_name|default:user.username }} · {{ request.empresa_activa.nombre }}</span></div><form class="mc-logout" method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button class="btn btn-outline-primary btn-sm">Salir</button></form><button class="btn btn-outline-primary app-menu-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#appMenu" aria-controls="appMenu" aria-expanded="false">Menú</button></div></header>
