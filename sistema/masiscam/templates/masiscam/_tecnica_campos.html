{% if form.non_field_errors %}<div class="col-12 alert alert-danger" role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}{% if field.is_hidden %}{{ field }}{% if field.errors %}<div class="col-12 text-danger">{{ field.errors }}</div>{% endif %}{% else %}<div class="col-12 col-lg-6"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger" role="alert">{{ field.errors }}</div>{% endif %}</div>{% endif %}{% endfor %}
