name: masiscam
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
x-app: &app
  image: masiscam-app:${MASISCAM_RELEASE:-local}
  env_file: .env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-masiscam}:${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}@db:5432/${POSTGRES_DB:-masiscam}
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
  volumes:
    - media:/app/media
    - staticfiles:/app/staticfiles
    - ./secrets:/run/secrets:ro
  logging: *logging
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-masiscam}
      POSTGRES_USER: ${POSTGRES_USER:-masiscam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec]
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging
  init:
    <<: *app
    build: .
    command: [sh, deploy/init.sh]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  web:
    <<: *app
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)"]
      interval: 30s
      timeout: 8s
      start_period: 40s
      retries: 3
    restart: unless-stopped
  worker:
    <<: *app
    command: [celery, -A, config, worker, --loglevel=INFO, --concurrency=2]
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'celery -A config inspect ping --destination "celery@$$(hostname)" --timeout 5 | grep -q pong']
      interval: 60s
      timeout: 15s
      start_period: 40s
      retries: 3
    restart: unless-stopped
  nginx:
    image: nginx:1.28-alpine
    ports:
      - '${HTTP_PORT:-127.0.0.1:8080}:80'
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/static:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/health/']
      interval: 30s
      timeout: 8s
      retries: 3
    restart: unless-stopped
    logging: *logging
volumes:
  postgres:
  redis:
  media:
  staticfiles:
